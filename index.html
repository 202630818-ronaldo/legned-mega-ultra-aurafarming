<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>랜덤박스 - AI 음식 추천</title>
    <style>
        /* CSS: 디자인 방향 - 깔끔하고 직관적인 카드 스타일 UI */
        :root {
            --primary-color: #ff6b6b;
            --secondary-color: #4ecdc4;
            --background-color: #f7f9fc;
            --card-color: #ffffff;
            --text-color: #2d3436;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-color);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 480px;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            color: var(--primary-color);
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        header p {
            font-size: 0.95rem;
            color: #636e72;
            margin-bottom: 25px;
        }

        .step {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }

        .step.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .step-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }

        .option-btn {
            background-color: #f1f3f5;
            border: 2px solid transparent;
            padding: 16px 10px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .option-btn:hover {
            border-color: var(--primary-color);
            background-color: #fff5f5;
        }

        .option-btn .icon {
            font-size: 1.8rem;
        }

        /* 로딩 화면 */
        .loading {
            padding: 40px 0;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* 결과 화면 */
        .result-card {
            background-color: #f8f9fa;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }

        .badge {
            display: inline-block;
            background-color: var(--secondary-color);
            color: white;
            font-size: 0.8rem;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 10px;
        }

        .grade {
            font-size: 1.1rem;
            color: #d63031;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .food-name {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 10px 0;
        }

        .description {
            font-size: 0.95rem;
            color: #4a4a4a;
            line-height: 1.5;
            word-break: keep-all;
        }

        .action-btn {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
            margin-top: 8px;
        }

        .action-btn:hover {
            background-color: #ee5253;
        }

        .secondary-btn {
            background-color: #74b9ff;
        }
        
        .secondary-btn:hover {
            background-color: #0984e3;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>🎁 AI 랜덤박스</h1>
        <p>선택 장애 해결! 빠르고 탁월하게 골라드립니다.</p>
    </header>

    <!-- STEP 1: 음식 종류 선택 -->
    <div id="step-1" class="step active">
        <div class="step-title">STEP 1. 어떤 종류를 드시겠어요?</div>
        <div class="options-grid">
            <button class="option-btn" onclick="selectStep1('식사')">
                <span class="icon">🍱</span>
                <span>든든한 식사</span>
            </button>
            <button class="option-btn" onclick="selectStep1('디저트')">
                <span class="icon">🍰</span>
                <span>달콤한 디저트</span>
            </button>
        </div>
    </div>

    <!-- STEP 2: 요리 스타일 선택 -->
    <div id="step-2" class="step">
        <div class="step-title">STEP 2. 카테고리를 선택하세요</div>
        <div class="options-grid" id="step2-options">
            <!-- JS로 동적 생성 -->
        </div>
    </div>

    <!-- STEP 3: 컨셉 선택 -->
    <div id="step-3" class="step">
        <div class="step-title">STEP 3. 어떤 AI 컨셉으로 고를까요?</div>
        <div class="options-grid">
            <button class="option-btn" onclick="selectStep3('monkey')">
                <span class="icon">🐵</span>
                <span>생각없는 원숭이</span>
            </button>
            <button class="option-btn" onclick="selectStep3('musk')">
                <span class="icon">🚀</span>
                <span>일론 머스크</span>
            </button>
            <button class="option-btn" onclick="selectStep3('chef')">
                <span class="icon">👨‍🍳</span>
                <span>3스타 셰프</span>
            </button>
            <button class="option-btn" onclick="selectStep3('god')">
                <span class="icon">✨</span>
                <span>운명의 신</span>
            </button>
        </div>
    </div>

    <!-- STEP 4: AI 분석 중 (로딩) -->
    <div id="step-4" class="step loading">
        <div class="spinner"></div>
        <div class="step-title">AI가 탁월한 선택을 계산 중입니다...</div>
        <p style="font-size: 0.85rem; color: #888;" id="loading-text">최적의 칼로리와 도파민을 분석하는 중</p>
    </div>

    <!-- STEP 5: 결과 및 재검토 -->
    <div id="step-5" class="step">
        <div class="result-card">
            <div class="badge" id="result-concept">컨셉</div>
            <div class="grade" id="result-grade">★ SSS급 추천 ★</div>
            <div class="food-name" id="result-food">메뉴 이름</div>
            <p class="description" id="result-desc">AI의 결과 설명 문구가 들어갑니다.</p>
        </div>
        
        <button class="action-btn secondary-btn" onclick="retryConcept()">🔄 다른 컨셉으로 다시 고르기</button>
        <button class="action-btn" onclick="resetAll()" style="margin-top: 8px;">🏠 처음부터 다시 하기</button>
    </div>
</div>

<script>
    // 서비스 데이터 관리 (직접 수정/추가 가능)
    const selection = {
        type: '',      // 식사 or 디저트
        category: '',  // 한식, 중식, 일식 등
        concept: ''    // monkey, musk, chef, god
    };

    // 데이터 베이스 (메뉴 및 컨셉별 알고리즘 문구)
    const db = {
        식사: {
            한식: ["김치찌개", "제육볶음", "비빔밥", "삼겹살", "국밥"],
            중식: ["짜장면", "짬뽕", "마라탕", "탕수육", "볶음밥"],
            일식: ["돈카츠", "초밥", "라멘", "사케동", "야키소바"],
            양식: ["파스타", "수제버거", "스테이크", "피자", "리조또"]
        },
        디저트: {
            카페: ["아메리카노 & 케이크", "크로플", "빙수", "소금빵"],
            길거리: ["붕어빵", "호떡", "타코야끼", "츄러스"]
        }
    };

    const concepts = {
        monkey: {
            name: "생각없는 원숭이 🐵",
            grade: "🍌 뇌 빼고 먹기 딱 좋은 S급",
            getDesc: (food) => `우끼끼!! 생각하지 마라! 그냥 **[${food}]** 먹어라! 고민하면 뇌만 아프다! 바나나 대신 이거 먹으면 기분 좋아진다 우끼!!`
        },
        musk: {
            name: "일론 머스크 🚀",
            grade: "🪐 화성 이주 대비 1순위 SSS급",
            getDesc: (food) => `화성 가려면 시간 없다. 효율성을 극대화한 오늘의 영양소는 **[${food}]**이다. 도지코인으로 결제하고 싶겠지만, 지금 바로 주문해서 도파민을 혁신해라.`
        },
        chef: {
            name: "3스타 셰프 👨‍🍳",
            grade: "⭐ 미슐랭 3스타 급 완벽한 미식",
            getDesc: (food) => `당신의 완벽한 한 끼를 위해 섬세하게 밸런스를 맞췄습니다. 오늘 당신의 미각을 깨워줄 최상의 메뉴는 **[${food}]**입니다. 풍미를 천천히 즐기십시오.`
        },
        god: {
            name: "운명의 신 ✨",
            grade: "🔮 우주의 기운이 담긴 럭키급",
            getDesc: (food) => `우주의 별들이 당신을 끌어당긴 곳은 바로 이곳이다. 망설임은 운명을 뒤틀 뿐, 지금 **[${food}]**을(를) 택하는 것이 오늘 당신의 운을 끌어올린다.`
        }
    };

    // STEP 1 선택
    function selectStep1(type) {
        selection.type = type;
        const step2Container = document.getElementById('step2-options');
        step2Container.innerHTML = '';

        // 식사/디저트에 따른 카테고리 동적 생성
        const categories = Object.keys(db[type]);
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.onclick = () => selectStep2(cat);
            btn.innerHTML = `<span class="icon">${getCategoryIcon(cat)}</span><span>${cat}</span>`;
            step2Container.appendChild(btn);
        });

        goToStep(2);
    }

    function getCategoryIcon(cat) {
        const icons = { '한식': '🍚', '중식': '🥢', '일식': '🍣', '양식': '🍕', '카페': '☕', '길거리': '🍢' };
        return icons[cat] || '🍴';
    }

    // STEP 2 선택
    function selectStep2(category) {
        selection.category = category;
        goToStep(3);
    }

    // STEP 3 선택 및 AI 결과 생성
    function selectStep3(conceptKey) {
        selection.concept = conceptKey;
        goToStep(4); // 로딩 화면으로 이동

        // 로딩 텍스트 변경 효과
        const loadingTexts = ["뇌파 측정 중...", "도파민 수치 계산 중...", "메뉴 데이터베이스 스캔 중..."];
        let textIndex = 0;
        const interval = setInterval(() => {
            textIndex = (textIndex + 1) % loadingTexts.length;
            document.getElementById('loading-text').innerText = loadingTexts[textIndex];
        }, 400);

        // 1.5초 후 결과 출력 (빠르고 탁월한 느낌 전달)
        setTimeout(() => {
            clearInterval(interval);
            generateResult();
            goToStep(5);
        }, 1500);
    }

    // 결과 알고리즘 (랜덤 선택 및 문구 조합)
    function generateResult() {
        const foodList = db[selection.type][selection.category];
        // 탁월하고 빠른 자동 선택 (랜덤 알고리즘)
        const randomFood = foodList[Math.floor(Math.random() * foodList.length)];
        const conceptInfo = concepts[selection.concept];

        document.getElementById('result-concept').innerText = conceptInfo.name;
        document.getElementById('result-grade').innerText = conceptInfo.grade;
        document.getElementById('result-food').innerText = randomFood;
        document.getElementById('result-desc').innerHTML = conceptInfo.getDesc(randomFood);
    }

    // STEP 5: 다른 컨셉으로 재검토
    function retryConcept() {
        goToStep(3);
    }

    // 처음으로 리셋
    function resetAll() {
        selection.type = '';
        selection.category = '';
        selection.concept = '';
        goToStep(1);
    }

    // 화면 전환 함수
    function goToStep(stepNum) {
        document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
        document.getElementById(`step-${stepNum}`).classList.add('active');
    }
</script>

</body>
</html>
