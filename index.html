<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 뭐 먹지?</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, "Noto Sans KR", sans-serif;
    background:
        radial-gradient(circle at 20% 10%, rgba(255,120,80,.12), transparent 30%),
        radial-gradient(circle at 80% 80%, rgba(120,80,255,.12), transparent 30%),
        #08090d;
    color: white;
    min-height: 100vh;
}

button {
    font-family: inherit;
}

.container {
    width: min(1200px, 92%);
    margin: auto;
    padding: 50px 0 80px;
}

.screen {
    display: none;
}

.screen.active {
    display: block;
}

.header {
    text-align: center;
    margin-bottom: 45px;
}

.logo {
    font-size: 16px;
    color: #aaa;
    letter-spacing: 4px;
    margin-bottom: 15px;
}

.title {
    font-size: clamp(38px, 7vw, 72px);
    font-weight: 900;
    letter-spacing: -4px;
}

.subtitle {
    margin-top: 15px;
    color: #999;
    font-size: 16px;
}

.progress {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 45px;
}

.progress span {
    width: 70px;
    height: 5px;
    background: #24262d;
    border-radius: 20px;
    transition: .4s;
}

.progress span.active {
    background: linear-gradient(90deg,#ff6b35,#ffb347);
    box-shadow: 0 0 15px rgba(255,120,50,.5);
}

/* CATEGORY */

.category-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 20px;
}

.category-card {
    position: relative;
    height: 300px;
    overflow: hidden;
    border-radius: 24px;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.1);
    background: #111;
    transition: .35s;
}

.category-card:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: rgba(255,255,255,.35);
    box-shadow: 0 20px 50px rgba(0,0,0,.5);
}

.category-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: .5s;
}

.category-card:hover img {
    transform: scale(1.08);
}

.category-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 30%,rgba(0,0,0,.9));
}

.category-name {
    position: absolute;
    bottom: 25px;
    left: 25px;
    font-size: 25px;
    font-weight: 800;
}

.refresh {
    display: block;
    margin: 30px auto 0;
    padding: 14px 25px;
    border-radius: 30px;
    border: 1px solid #444;
    color: white;
    background: rgba(255,255,255,.05);
    cursor: pointer;
    transition: .3s;
}

.refresh:hover {
    background: white;
    color: black;
}

/* STYLE */

.style-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 18px;
}

.style-card {
    padding: 28px;
    border-radius: 22px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    cursor: pointer;
    transition: .3s;
}

.style-card:hover {
    transform: translateY(-5px);
    background: rgba(255,255,255,.09);
    border-color: #ff784e;
}

.style-icon {
    font-size: 35px;
    margin-bottom: 18px;
}

.style-name {
    font-size: 20px;
    font-weight: 800;
}

.style-description {
    color: #999;
    margin-top: 8px;
    line-height: 1.5;
}

/* ANALYSIS */

.analysis-header {
    text-align: center;
    margin-bottom: 35px;
}

.analysis-title {
    font-size: 34px;
    font-weight: 900;
}

.analysis-status {
    margin-top: 10px;
    color: #aaa;
}

.analysis-bar {
    height: 8px;
    background: #202229;
    border-radius: 20px;
    overflow: hidden;
    margin: 25px 0 35px;
}

.analysis-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg,#ff5733,#ffb347);
    transition: width .6s;
}

.food-grid {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 15px;
}

.food-card {
    position: relative;
    min-height: 210px;
    overflow: hidden;
    border-radius: 18px;
    background: #15161b;
    border: 1px solid rgba(255,255,255,.08);
    transition: .5s;
}

.food-card img {
    width: 100%;
    height: 145px;
    object-fit: cover;
}

.food-info {
    padding: 12px;
}

.food-name {
    font-weight: 800;
}

.food-score {
    color: #ffae66;
    font-size: 13px;
    margin-top: 5px;
}

.food-card.eliminated {
    opacity: .12;
    filter: grayscale(1);
    transform: scale(.94);
}

.food-card.survivor {
    border-color: #ff874f;
    box-shadow: 0 0 20px rgba(255,120,60,.15);
}

/* RESULT */

.result-title {
    text-align: center;
    font-size: 45px;
    font-weight: 900;
    margin-bottom: 10px;
}

.result-subtitle {
    text-align: center;
    color: #aaa;
    margin-bottom: 40px;
}

.final-card {
    position: relative;
    max-width: 650px;
    margin: auto;
    border-radius: 30px;
    overflow: hidden;
    border: 1px solid rgba(255,180,80,.5);
    box-shadow: 0 0 80px rgba(255,120,50,.15);
}

.final-card img {
    width: 100%;
    height: 420px;
    object-fit: cover;
}

.final-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 30%,rgba(0,0,0,.95));
}

.final-content {
    position: absolute;
    bottom: 30px;
    left: 30px;
}

.final-label {
    color: #ffad63;
    font-weight: 800;
    letter-spacing: 2px;
}

.final-name {
    font-size: 50px;
    font-weight: 900;
    margin: 8px 0;
}

.final-reason {
    color: #ddd;
    line-height: 1.6;
    max-width: 550px;
}

.top3 {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 20px;
    margin-top: 35px;
}

.rank-card {
    border-radius: 22px;
    overflow: hidden;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
}

.rank-card img {
    width: 100%;
    height: 190px;
    object-fit: cover;
}

.rank-info {
    padding: 18px;
}

.rank {
    color: #ffad63;
    font-weight: 900;
}

.rank-name {
    font-size: 21px;
    font-weight: 800;
    margin-top: 5px;
}

.rank-score {
    color: #999;
    margin-top: 6px;
}

.restart {
    display: block;
    margin: 40px auto 0;
    padding: 16px 35px;
    border: none;
    border-radius: 30px;
    background: white;
    color: black;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: .3s;
}

.restart:hover {
    transform: scale(1.05);
}

/* MOBILE */

@media(max-width:900px) {
    .category-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .food-grid {
        grid-template-columns: repeat(3,1fr);
    }

    .style-grid {
        grid-template-columns: repeat(2,1fr);
    }
}

@media(max-width:600px) {
    .container {
        padding-top: 30px;
    }

    .category-grid,
    .style-grid,
    .top3 {
        grid-template-columns: 1fr;
    }

    .category-card {
        height: 220px;
    }

    .food-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .final-card img {
        height: 330px;
    }

    .final-name {
        font-size: 36px;
    }
}
</style>
</head>

    name:"친구처럼 추천",
    icon:"😎",
    desc:"오늘 당장 먹고 싶은 메뉴를 친구처럼 골라줍니다.",
    weights:{
        quality:1,
        popularity:1.4,
        random:.5
    }
},

{
    name:"부모님처럼 추천",
    icon:"👨‍👩‍👦",
    desc:"든든함과 균형을 중요하게 생각합니다.",
    weights:{
        quality:1.3,
        popularity:1,
        random:.2
    }
},

{
    name:"점쟁이처럼 추천",
    icon:"🔮",
    desc:"오늘의 운과 분위기를 보고 운명적인 메뉴를 찾습니다.",
    weights:{
        quality:.8,
        popularity:.7,
        random:2
    }
},

{
    name:"극도로 논리적인 AI",
    icon:"🤖",
    desc:"모든 요소를 계산해서 가장 합리적인 선택을 찾습니다.",
    weights:{
        quality:2,
        popularity:1,
        random:0
    }
},

{
    name:"아무 생각 없는 랜덤봇",
    icon:"🎲",
    desc:"아무 이유 없이 그냥 하나를 골라버립니다.",
    weights:{
        quality:0,
        popularity:0,
        random:10
    }
}

];


/* =========================================================
   STATE
========================================================= */

let selectedCategory = null;
let selectedStyle = null;
let currentFoods = [];
let previousCategories = [];


/* =========================================================
   UTILITY
========================================================= */

function randomArray(arr) {

    return [...arr].sort(() => Math.random() - .5);

}


/* =========================================================
   CATEGORY
========================================================= */

function generateCategories() {

    let pool = categories.filter(
        c => !previousCategories.includes(c.name)
    );

    if(pool.length < 4) {
        pool = categories;
    }

    const selected = randomArray(pool).slice(0,4);

    previousCategories = selected.map(c => c.name);

    const grid = document.getElementById("categoryGrid");

    grid.innerHTML = "";

    selected.forEach(category => {

        const card = document.createElement("div");

        card.className = "category-card";

        card.innerHTML = `
            <img src="${category.image}"
                 alt="${category.name}"
                 onerror="this.style.background='#222'">

            <div class="category-overlay"></div>

            <div class="category-name">
                ${category.name}
            </div>
        `;

        card.onclick = () => selectCategory(category);

        grid.appendChild(card);

    });

}


/* =========================================================
   SELECT CATEGORY
========================================================= */

function selectCategory(category) {

    selectedCategory = category;

    showScreen("styleScreen");

    renderStyles();

}


/* =========================================================
   STYLE
========================================================= */

function renderStyles() {

    const grid = document.getElementById("styleGrid");

    grid.innerHTML = "";

    styles.forEach((style,index) => {

        const card = document.createElement("div");

        card.className = "style-card";

        card.innerHTML = `
            <div class="style-icon">${style.icon}</div>
            <div class="style-name">${style.name}</div>
            <div class="style-description">
                ${style.desc}
            </div>
        `;

        card.onclick = () => selectStyle(index);

        grid.appendChild(card);

    });

}


/* =========================================================
   SELECT STYLE
========================================================= */

function selectStyle(index) {

    selectedStyle = styles[index];

    showScreen("analysisScreen");

    startAnalysis();

}


/* =========================================================
   FOOD PREPARATION
========================================================= */

function prepareFoods() {

    const source = foods[selectedCategory.name] || [];

    currentFoods = randomArray(source)
        .slice(0,20)
        .map((food,index) => {

            return {
                id:index,
                name:food[0],
                description:food[1],
                image:food[2],
                base:50 + Math.random()*50,
                popularity:50 + Math.random()*50,
                quality:50 + Math.random()*50,
                random:Math.random()*100,
                score:0
            };

        });

    currentFoods.forEach(food => {

        const w = selectedStyle.weights;

        food.score =
            food.quality * w.quality +
            food.popularity * w.popularity +
            food.random * w.random;

    });

}


/* =========================================================
   FOOD GRID
========================================================= */

function renderFoodGrid() {

    const grid = document.getElementById("foodGrid");

    grid.innerHTML = "";

    currentFoods.forEach(food => {

        const card = document.createElement("div");

        card.className = "food-card";

        card.dataset.id = food.id;

        card.innerHTML = `
            <img src="${food.image}"
                 alt="${food.name}"
                 onerror="this.style.background='#222'">

            <div class="food-info">
                <div class="food-name">${food.name}</div>
                <div class="food-score">
                    분석 점수 ${Math.round(food.score)}
                </div>
            </div>
        `;

        grid.appendChild(card);

    });

}


/* =========================================================
   ELIMINATION
========================================================= */

function eliminateTo(count) {

    currentFoods.sort((a,b) => b.score - a.score);

    const survivors = currentFoods.slice(0,count);

    const survivorIds = survivors.map(x => x.id);

    document.querySelectorAll(".food-card").forEach(card => {

        const id = Number(card.dataset.id);

        if(!survivorIds.includes(id)) {

            card.classList.add("eliminated");

        } else {

            card.classList.add("survivor");

        }

    });

    currentFoods = survivors;

}


/* =========================================================
   ANALYSIS
========================================================= */

function startAnalysis() {

    prepareFoods();

    renderFoodGrid();

    const fill = document.getElementById("analysisFill");

    const status = document.getElementById("analysisStatus");

    fill.style.width = "10%";

    status.textContent =
        `${selectedCategory.name} 음식 후보 ${currentFoods.length}개를 불러왔습니다.`;

    setTimeout(() => {

        fill.style.width = "30%";

        status.textContent =
            "음식의 특징과 선호도를 분석하고 있습니다.";

    },1000);


    setTimeout(() => {

        eliminateTo(10);

        fill.style.width = "50%";

        status.textContent =
            "조건에 맞지 않는 후보를 제거했습니다. 20 → 10";

    },2200);


    setTimeout(() => {

        eliminateTo(6);

        fill.style.width = "70%";

        status.textContent =
            "더 까다롭게 비교하고 있습니다. 10 → 6";

    },3500);


    setTimeout(() => {

        eliminateTo(3);

        fill.style.width = "90%";

        status.textContent =
            "마지막 TOP 3를 결정하고 있습니다. 6 → 3";

    },4800);


    setTimeout(() => {

        fill.style.width = "100%";

        status.textContent =
            "최종 판결 완료.";

    },6000);


    setTimeout(() => {

        showResult();

    },7000);

}


/* =========================================================
   RESULT
========================================================= */

function showResult() {

    showScreen("resultScreen");

    currentFoods.sort((a,b) => b.score - a.score);

    const winner = currentFoods[0];

    const final = document.getElementById("finalResult");

    final.innerHTML = `
        <div class="final-card">

            <img src="${winner.image}"
                 alt="${winner.name}"
                 onerror="this.style.background='#222'">

            <div class="final-overlay"></div>

            <div class="final-content">

                <div class="final-label">
                    TODAY'S FINAL PICK
                </div>

                <div class="final-name">
                    ${winner.name}
                </div>

                <div class="final-reason">
                    ${getReason(winner)}
                </div>

            </div>

        </div>
    `;


    const top3 = document.getElementById("top3");

    top3.innerHTML = "";

    currentFoods.slice(0,3).forEach((food,index) => {

        const card = document.createElement("div");

        card.className = "rank-card";

        card.innerHTML = `

            <img src="${food.image}"
                 alt="${food.name}"
                 onerror="this.style.background='#222'">

            <div class="rank-info">

                <div class="rank">
                    ${index+1}위
                </div>

                <div class="rank-name">
                    ${food.name}
                </div>

                <div class="rank-score">
                    점수 ${Math.round(food.score)}
                </div>

            </div>

        `;

        top3.appendChild(card);

    });

}


/* =========================================================
   REASON
========================================================= */

function getReason(food) {

    const name = selectedStyle.name;

    if(name === "냉정한 판사") {

        return `
        감정적인 요소를 최대한 배제하고 음식의 완성도와
        오늘의 선택 가치만을 기준으로 평가했습니다.
        ${food.name}이 가장 높은 점수를 기록했습니다.
        `;

    }

    if(name === "친구처럼 추천") {

        return `
        오늘 그냥 먹었을 때 가장 만족도가 높을 것 같은 메뉴입니다.
        고민하지 말고 ${food.name}으로 가보세요.
        `;

    }

    if(name === "부모님처럼 추천") {

        return `
        너무 자극적이기만 한 선택보다는 든든하게 한 끼를
        제대로 먹을 수 있는지를 중요하게 봤습니다.
        `;

    }

    if(name === "점쟁이처럼 추천") {

        return `
        오늘은 이상하게 ${food.name}이 계속 눈에 들어오는 날입니다.
        이건 그냥 운명이라고 생각하세요.
        `;

    }

    if(name === "극도로 논리적인 AI") {

        return `
        후보들의 평가값을 종합적으로 계산한 결과
        ${food.name}이 가장 높은 종합 점수를 기록했습니다.
        `;

    }

    return `
        특별한 이유는 없습니다.
        그냥 ${food.name}이 나왔습니다.
        오늘은 이겁니다. 🎲
    `;

}


/* =========================================================
   SCREEN
========================================================= */

function showScreen(id) {

    document.querySelectorAll(".screen")
        .forEach(screen => screen.classList.remove("active"));

    document.getElementById(id)
        .classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   RESTART
========================================================= */

function restart() {

    selectedCategory = null;
    selectedStyle = null;
    currentFoods = [];

    showScreen("categoryScreen");

    generateCategories();

}


/* =========================================================
   INIT
========================================================= */

generateCategories();

</script>

</body>
</html>
