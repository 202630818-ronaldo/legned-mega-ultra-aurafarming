<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오늘 뭐 먹지?</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap');

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Noto Sans KR', sans-serif;
    background:
        radial-gradient(circle at 20% 10%, rgba(255,100,50,.18), transparent 30%),
        radial-gradient(circle at 80% 20%, rgba(100,80,255,.15), transparent 30%),
        #08080c;
    color: white;
    min-height: 100vh;
    overflow-x: hidden;
}

button {
    font-family: inherit;
}

.container {
    width: min(1200px, 92%);
    margin: auto;
}

/* HEADER */

header {
    padding: 30px 0;
    text-align: center;
}

.logo {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #ff7a45;
}

.header-title {
    margin-top: 35px;
    font-size: clamp(38px, 7vw, 72px);
    font-weight: 900;
    letter-spacing: -4px;
}

.header-title span {
    background: linear-gradient(90deg,#ff7043,#ffb347);
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    margin-top: 15px;
    color: #999;
    font-size: 16px;
}

/* PROGRESS */

.progress {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
    margin: 35px 0;
}

.progress-step {
    width: 100px;
    height: 5px;
    background: #29292f;
    border-radius: 10px;
    transition: .4s;
}

.progress-step.active {
    background: linear-gradient(90deg,#ff643d,#ffb347);
    box-shadow: 0 0 15px rgba(255,100,60,.5);
}

/* SCREENS */

.screen {
    display: none;
    animation: screenIn .5s ease;
}

.screen.active {
    display: block;
}

@keyframes screenIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.section-title {
    text-align: center;
    font-size: 32px;
    font-weight: 800;
    margin-bottom: 10px;
}

.section-desc {
    text-align: center;
    color: #888;
    margin-bottom: 35px;
}

/* CATEGORY */

.category-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 18px;
}

.category-card {
    position: relative;
    min-height: 230px;
    border-radius: 24px;
    overflow: hidden;
    cursor: pointer;
    border: 1px solid rgba(255,255,255,.08);
    background: #15151b;
    transition: .35s;
}

.category-card:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: rgba(255,120,70,.7);
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

.category-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    position: absolute;
    inset: 0;
    transition: .5s;
}

.category-card:hover img {
    transform: scale(1.08);
}

.category-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(
        transparent 20%,
        rgba(0,0,0,.9) 100%
    );
}

.category-name {
    position: absolute;
    bottom: 20px;
    left: 20px;
    font-size: 25px;
    font-weight: 900;
}

/* STYLE */

.style-grid {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 18px;
}

.style-card {
    padding: 28px;
    min-height: 190px;
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 24px;
    cursor: pointer;
    transition: .3s;
    backdrop-filter: blur(15px);
}

.style-card:hover {
    transform: translateY(-6px);
    border-color: #ff7448;
    background: rgba(255,100,60,.08);
}

.style-icon {
    font-size: 38px;
    margin-bottom: 18px;
}

.style-name {
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 8px;
}

.style-desc {
    color: #999;
    line-height: 1.6;
    font-size: 14px;
}

/* ANALYSIS */

.analysis-header {
    text-align: center;
    margin-bottom: 30px;
}

.ai-badge {
    display: inline-block;
    padding: 8px 16px;
    border-radius: 50px;
    background: rgba(255,100,60,.12);
    color: #ff895e;
    font-size: 13px;
    margin-bottom: 15px;
}

.analysis-title {
    font-size: 34px;
    font-weight: 900;
}

.analysis-status {
    color: #888;
    margin-top: 10px;
}

.analysis-box {
    padding: 25px;
    background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 25px;
    margin-bottom: 25px;
}

.analysis-bar {
    height: 8px;
    background: #27272d;
    border-radius: 20px;
    overflow: hidden;
}

.analysis-progress {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg,#ff603b,#ffb347);
    transition: width .5s;
}

.analysis-stage {
    margin-top: 14px;
    color: #aaa;
    font-size: 14px;
}

.food-grid {
    display: grid;
    grid-template-columns: repeat(5,1fr);
    gap: 12px;
}

.food-card {
    background: #15151a;
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 16px;
    overflow: hidden;
    transition: .5s;
}

.food-card img {
    width: 100%;
    height: 130px;
    object-fit: cover;
}

.food-info {
    padding: 12px;
}

.food-name {
    font-weight: 800;
    font-size: 14px;
}

.food-score {
    margin-top: 5px;
    font-size: 12px;
    color: #ff895e;
}

.food-card.eliminated {
    opacity: .12;
    transform: scale(.85);
    filter: grayscale(1);
}

/* RESULT */

.result-header {
    text-align: center;
    margin-bottom: 35px;
}

.result-label {
    color: #ff865b;
    font-size: 14px;
    font-weight: 800;
    letter-spacing: 2px;
}

.result-title {
    font-size: clamp(40px,7vw,70px);
    font-weight: 900;
    margin-top: 8px;
}

.top3 {
    display: grid;
    grid-template-columns: repeat(3,1fr);
    gap: 20px;
    align-items: end;
}

.result-card {
    background: rgba(255,255,255,.05);
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 28px;
    overflow: hidden;
    animation: resultIn .7s ease;
}

@keyframes resultIn {
    from {
        opacity: 0;
        transform: translateY(40px) scale(.9);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.result-card.first {
    border: 2px solid #ff774c;
    box-shadow: 0 0 50px rgba(255,100,60,.18);
    transform: scale(1.04);
}

.result-rank {
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 900;
    color: #ff916b;
}

.result-card img {
    width: 100%;
    height: 220px;
    object-fit: cover;
}

.result-content {
    padding: 22px;
}

.result-name {
    font-size: 25px;
    font-weight: 900;
}

.result-desc {
    color: #999;
    font-size: 14px;
    line-height: 1.6;
    margin-top: 10px;
}

.result-score {
    margin-top: 18px;
    font-size: 14px;
}

.result-reason {
    margin-top: 15px;
    padding: 15px;
    background: rgba(255,255,255,.04);
    border-radius: 14px;
    color: #bbb;
    font-size: 13px;
    line-height: 1.6;
}

.final-recommendation {
    margin-top: 40px;
    padding: 35px;
    border-radius: 28px;
    background:
        linear-gradient(
            135deg,
            rgba(255,100,60,.12),
            rgba(255,180,70,.05)
        );
    border: 1px solid rgba(255,120,70,.3);
    text-align: center;
}

.final-small {
    color: #ff895e;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2px;
}

.final-name {
    font-size: 42px;
    font-weight: 900;
    margin: 8px 0;
}

.final-text {
    color: #aaa;
}

/* BUTTON */

.button-area {
    text-align: center;
    margin: 40px 0;
}

.main-button {
    border: none;
    padding: 17px 35px;
    border-radius: 50px;
    background: linear-gradient(90deg,#ff613d,#ff9d52);
    color: white;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    transition: .3s;
    box-shadow: 0 10px 30px rgba(255,90,50,.25);
}

.main-button:hover {
    transform: translateY(-3px);
    box-shadow: 0 15px 40px rgba(255,90,50,.4);
}

.secondary-button {
    margin-left: 10px;
    background: rgba(255,255,255,.07);
    box-shadow: none;
}

.hidden {
    display: none !important;
}

/* MOBILE */

@media(max-width:900px) {
    .category-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .style-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .food-grid {
        grid-template-columns: repeat(3,1fr);
    }
}

@media(max-width:600px) {
    .category-grid,
    .style-grid,
    .top3 {
        grid-template-columns: 1fr;
    }

    .food-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .header-title {
        letter-spacing: -2px;
    }

    .result-card.first {
        transform: none;
    }
}
</style>
</head>

    <div class="button-area">
        <button class="main-button" onclick="shuffleCategories()">
            🔀 다시 만들기
        </button>
    </div>

</section>


<!-- =========================
     SCREEN 2
========================= -->

<section id="styleScreen" class="screen">

    <h2 class="section-title">
        어떤 방식으로 골라드릴까요?
    </h2>

    <p class="section-desc">
        선택한 방식에 따라 AI의 판단 기준이 달라집니다.
    </p>

    <div id="styleGrid" class="style-grid"></div>

    <div class="button-area">
        <button class="main-button secondary-button"

</section>


<!-- =========================
     SCREEN 3
========================= -->

<section id="analysisScreen" class="screen">

    <div class="analysis-header">

            AI DECISION ENGINE
        </div>

        <h2 class="analysis-title">
            후보 음식들을 분석하고 있습니다
        </h2>

        <p id="analysisStatus" class="analysis-status">
            데이터를 불러오는 중...
        </p>

    </div>

    <div class="analysis-box">

        <div class="analysis-bar">
            <div id="analysisProgress"
                 class="analysis-progress"></div>
        </div>

        <div id="analysisStage"
             class="analysis-stage">
            후보 음식 준비 중...
        </div>

    </div>

    <div id="foodGrid" class="food-grid"></div>

</section>


<!-- =========================
     SCREEN 4
========================= -->

<section id="resultScreen" class="screen">

    <div class="result-header">

        <div class="result-label">
            AI FINAL DECISION
        </div>

        <h2 class="result-title">
            오늘의 추천 결과
        </h2>

    </div>

    <div id="top3" class="top3"></div>

    <div id="finalRecommendation"
         class="final-recommendation">
    </div>

    <div class="button-area">

        <button class="main-button"
                onclick="restart()">
            🔄 다시 추천받기
        </button>

    </div>

</section>

</div>

/* =====================================
   AI STYLES
===================================== */

const styles = [

{
    name:"냉정한 판사",
    icon:"⚖️",
    desc:"감정은 배제하고 객관적인 기준으로 냉정하게 판결합니다.",
    weights:{base:1, popularity:1.2, quality:1.4, variety:1}
},

{

    icon:"😎",

},

},

{
    name:"점쟁이처럼 추천",
    icon:"🔮",
    desc:"오늘의 운과 묘한 우연을 바탕으로 운명적인 메뉴를 찾습니다.",
    weights:{base:.8, popularity:.7, quality:.8, variety:1.8}
},

{
    name:"극도로 논리적인 AI",
    icon:"🤖",
    desc:"여러 요소를 계산해 가장 높은 점수를 받은 메뉴를 찾습니다.",
    weights:{base:1, popularity:1.5, quality:1.5, variety:1.2}
},

{
    name:"아무 생각 없는 랜덤봇",
    icon:"🎲",
    desc:"복잡하게 생각하지 않습니다. 그냥 운명에 맡깁니다.",
    weights:{base:1, popularity:1, quality:1, variety:1}
}

];


/* =====================================
   STATE
===================================== */

let selectedCategory = null;
let selectedStyle = null;
let currentFoods = [];
let previousCategories = [];


/* =====================================
   CATEGORY
===================================== */

function shuffleArray(array) {

    return [...array].sort(() => Math.random() - .5);

}


function generateCategories() {

    let available = categories.filter(
        c => !previousCategories.includes(c.name)
    );

    if(available.length < 4) {
        available = [...categories];
    }

    const selected = shuffleArray(available).slice(0,4);

    previousCategories = selected.map(c => c.name);

    return selected;
}


function renderCategories() {

    const grid = document.getElementById("categoryGrid");

    grid.innerHTML = "";

    generateCategories().forEach(category => {

        const card = document.createElement("div");

        card.className = "category-card";

        card.innerHTML = `
            <img src="${category.image}">
            <div class="category-overlay"></div>
            <div class="category-name">${category.name}</div>
        `;

        card.onclick = () => selectCategory(category.name);

        grid.appendChild(card);

    });

}


function shuffleCategories() {

    renderCategories();

}


/* =====================================
   STYLE
===================================== */

function renderStyles() {

    const grid = document.getElementById("styleGrid");

    grid.innerHTML = "";

    styles.forEach(style => {

        const card = document.createElement("div");

        card.className = "style-card";

        card.innerHTML = `
            <div class="style-icon">${style.icon}</div>
            <div class="style-name">${style.name}</div>
            <div class="style-desc">${style.desc}</div>
        `;

        card.onclick = () => selectStyle(style);

        grid.appendChild(card);

    });

}


function selectCategory(category) {

    selectedCategory = category;

    showScreen("styleScreen");

    updateProgress(2);

}


/* =====================================
   STYLE SELECT
===================================== */

function selectStyle(style) {

    selectedStyle = style;

    startAnalysis();

}


/* =====================================
   SCREEN CONTROL
===================================== */

function showScreen(id) {

    document.querySelectorAll(".screen").forEach(
        screen => screen.classList.remove("active")
    );

    document.getElementById(id).classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function updateProgress(step) {

    for(let i=1;i<=4;i++) {

        const el = document.getElementById("p"+i);

        if(i <= step)
            el.classList.add("active");
        else
            el.classList.remove("active");

    }

}


function goToCategory() {

    showScreen("categoryScreen");

    updateProgress(1);

}


/* =====================================
   FOOD PREPARATION
===================================== */

function prepareFoods() {

    let data = foods[selectedCategory] || [];

    data = shuffleArray(data);

    return data.map(item => ({

        name:item[0],
        image:item[1],
        description:item[2],
        base:item[3],
        score:0,
        eliminated:false

    }));

}


/* =====================================
   AI SCORING
===================================== */

function calculateScore(food,index) {

    const w = selectedStyle.weights;

    let randomFactor = Math.random() * 5;

    let popularity = food.base;

    let quality = food.base + Math.random() * 3;

    let variety = (index % 5) + Math.random() * 3;

    let score =
        popularity * w.popularity +
        quality * w.quality +
        variety * w.variety +
        randomFactor * w.base;

    return Math.round(score * 10) / 10;

}


/* =====================================
   FOOD GRID
===================================== */

function renderFoodGrid() {

    const grid = document.getElementById("foodGrid");

    grid.innerHTML = "";

    currentFoods.forEach((food,index) => {

        const card = document.createElement("div");

        card.className = "food-card";

        card.dataset.index = index;

        card.innerHTML = `
            <img src="${food.image}">
            <div class="food-info">
                <div class="food-name">${food.name}</div>
                <div class="food-score">
                    분석 점수 ${food.score.toFixed(1)}
                </div>
            </div>
        `;

        grid.appendChild(card);

    });

}


/* =====================================
   ELIMINATION
===================================== */

function eliminateLowest(targetCount) {

    const activeFoods = currentFoods
        .filter(food => !food.eliminated)
        .sort((a,b) => b.score - a.score);

    const survivors = activeFoods.slice(0,targetCount);

    currentFoods.forEach(food => {

        if(!survivors.includes(food)) {

            food.eliminated = true;

            const index = currentFoods.indexOf(food);

            const card = document.querySelector(
                `.food-card[data-index="${index}"]`
            );

            if(card)
                card.classList.add("eliminated");

        }

    });

}


/* =====================================
   ANALYSIS
===================================== */

async function startAnalysis() {

    showScreen("analysisScreen");

    updateProgress(3);

    currentFoods = prepareFoods();

    currentFoods.forEach((food,index) => {

        food.score = calculateScore(food,index);

    });

    renderFoodGrid();

    const progress = document.getElementById("analysisProgress");

    const status = document.getElementById("analysisStatus");

    const stage = document.getElementById("analysisStage");


    status.innerText =
        `${selectedCategory} 음식 ${currentFoods.length}개를 분석 중입니다.`;


    progress.style.width = "10%";

    stage.innerText =
        "후보 음식 데이터를 불러왔습니다.";

    await wait(1000);


    progress.style.width = "30%";

    stage.innerText =
        `${selectedStyle.name} 방식으로 1차 평가 중...`;

    await wait(1000);


    eliminateLowest(10);

    progress.style.width = "50%";

    stage.innerText =
        "1차 탈락자를 결정했습니다. 후보를 10개로 압축합니다.";

    await wait(1200);


    eliminateLowest(6);

    progress.style.width = "70%";

    stage.innerText =
        "2차 심층 분석 중... 최종 후보를 좁히고 있습니다.";

    await wait(1200);


    eliminateLowest(3);

    progress.style.width = "90%";

    stage.innerText =
        "최종 TOP 3를 결정했습니다.";

    await wait(1200);


    progress.style.width = "100%";

    stage.innerText =
        "최종 추천을 결정했습니다.";

    await wait(1000);


    showResult();

}


function wait(ms) {

    return new Promise(resolve => setTimeout(resolve,ms));

}


/* =====================================
   FINAL RESULT
===================================== */

function showResult() {

    updateProgress(4);

    showScreen("resultScreen");

    const finalists = currentFoods
        .filter(food => !food.eliminated)
        .sort((a,b) => b.score - a.score)
        .slice(0,3);

    const top3 = document.getElementById("top3");

    top3.innerHTML = "";

    finalists.forEach((food,index) => {

        const card = document.createElement("div");

        card.className =
            "result-card " +
            (index === 0 ? "first" : "");

        let reason = getReason(food,index);

        card.innerHTML = `

            <div class="result-rank">
                ${index === 0 ? "🥇 1위" :
                  index === 1 ? "🥈 2위" :
                  "🥉 3위"}
            </div>

            <img src="${food.image}">

            <div class="result-content">

                <div class="result-name">
                    ${food.name}
                </div>

                <div class="result-desc">
                    ${food.description}
                </div>

                <div class="result-score">
                    AI 결정 점수:
                    <strong>${food.score.toFixed(1)}</strong>
                </div>

                <div class="result-reason">
                    ${reason}
                </div>

            </div>
        `;

        top3.appendChild(card);

    });


    const winner = finalists[0];

    document.getElementById("finalRecommendation").innerHTML = `

        <div class="final-small">
            TODAY'S FINAL RECOMMENDATION
        </div>

        <div class="final-name">
            🍽️ ${winner.name}
        </div>

        <p class="final-text">
            ${selectedStyle.name} 방식으로 분석한 결과,
            오늘은 <strong>${winner.name}</strong>을(를)
            추천합니다.
        </p>

    `;

}


function getReason(food,index) {

    if(selectedStyle.name === "냉정한 판사") {

        return `맛의 대중성, 기본 점수, 메뉴의 매력도를 종합적으로 비교한 결과 ${index === 0 ? "가장 높은 평가" : "상위권 평가"}를 받았습니다.`;

    }

    if(selectedStyle.name === "친구처럼 추천") {

        return `오늘 뭔가 맛있는 걸 확실하게 먹고 싶다면 ${food.name}이(가) 꽤 좋은 선택입니다. 친구라면 이 메뉴를 추천할 것 같아요.`;

    }

    if(selectedStyle.name === "부모님처럼 추천") {

        return `너무 튀는 선택보다는 든든하게 한 끼를 해결할 수 있는지를 중요하게 보고 평가했습니다.`;

    }

    if(selectedStyle.name === "점쟁이처럼 추천") {

        return `🔮 오늘 이상하게 이 메뉴가 눈에 들어온다면 그냥 운명일지도 모릅니다. 오늘의 음식 운은 ${food.name} 쪽으로 기울었습니다.`;

    }

    if(selectedStyle.name === "극도로 논리적인 AI") {

        return `인기도, 기본 평가, 다양성, 무작위 변수 등을 복합적으로 계산한 결과 높은 종합 점수를 기록했습니다.`;

    }

    return `🎲 특별한 이유는 없습니다. 오늘의 운명 알고리즘이 ${food.name}을(를) 선택했습니다.`;

}


/* =====================================
   RESTART
===================================== */

function restart() {

    selectedCategory = null;
    selectedStyle = null;
    currentFoods = [];

    renderCategories();

    showScreen("categoryScreen");

    updateProgress(1);

}


/* =====================================
   INITIALIZE
===================================== */

renderCategories();

renderStyles();

</script>
